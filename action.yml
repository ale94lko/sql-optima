name: 'SQL Optima Action'
description: 'Automated SQL parser, schema linter, and dynamic query execution analyzer'
author: 'ale94lko'

inputs:
  engine:
    description: 'Database engine (postgres | mysql | mariadb | sqlite | mssql | bigquery | snowflake | cockroachdb | aurora-postgres | aurora-mysql | …)'
    required: false
    default: 'postgres'
  sql_file:
    description: 'Path to a SQL file in the workspace to analyze (takes precedence over sql_content)'
    required: false
  sql_content:
    description: 'SQL code or script to analyze'
    required: false
  db_host:
    description: 'Database host (ignored for sqlite and static-only engines)'
    required: false
    default: 'localhost'
  db_port:
    description: 'Database port (5432 postgres family, 3306 mysql/mariadb, 1433 mssql; ignored for sqlite/static-only)'
    required: false
    default: '5432'
  db_name:
    description: 'Database name (ignored for sqlite and static-only engines)'
    required: false
    default: 'test_db'
  db_user:
    description: 'Database user (ignored for sqlite and static-only engines)'
    required: false
    default: 'postgres'
  db_password:
    description: 'Database password (required for live engines: postgres/mysql/mssql families; ignored for sqlite and static-only)'
    required: false
    default: ''
  fail_on_severity:
    description: 'Fail the job if any finding meets or exceeds this severity (none | info | low | medium | high | critical)'
    required: false
    default: 'none'
  fail_on_types:
    description: 'Comma-separated issue types that always fail the job (e.g. MISSING_PRIMARY_KEY,WILDCARD_SELECT)'
    required: false
    default: ''
  job_summary:
    description: 'How much to write to $GITHUB_STEP_SUMMARY (full | compact | none). File report and outputs are always produced.'
    required: false
    default: 'full'

outputs:
  report:
    description: 'Compact Markdown report (safe for Job Summary / Action outputs; large SQL embeds may be truncated)'
  report_path:
    description: 'Workspace-relative path to the full Markdown report file (sql-optima-report.md)'
  issue_count:
    description: 'Total number of static + dynamic findings'
  highest_severity:
    description: 'Highest finding severity (NONE | INFO | LOW | MEDIUM | HIGH | CRITICAL)'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'database'
  color: 'blue'
