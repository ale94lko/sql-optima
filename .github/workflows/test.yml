name: Test SQL Optima Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [analyze-sql]
  workflow_dispatch:

jobs:
  test-postgres-analysis:
    name: Run SQL Optima against PostgreSQL
    runs-on: ubuntu-latest

    # Ephemeral PostgreSQL container service for dynamic EXPLAIN checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build dist
        run: |
          npm ci
          npm run test:coverage
          npm run build

      # Seed tables required for dynamic EXPLAIN on the sample SELECT statements
      - name: Prepare database schema
        env:
          PGPASSWORD: root
        run: psql -h localhost -U postgres -d test_db -f examples/seed_postgres.sql

      - name: Load mixed Postgres sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_postgres.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Analyze checked-in sample SQL (static + dynamic findings in Step Summary)
      - name: Run SQL Optima (sample fixtures)
        uses: ./
        with:
          engine: 'postgres'
          db_host: 'localhost'
          db_port: '5432'
          db_name: 'test_db'
          db_user: 'postgres'
          db_password: 'root'
          sql_content: ${{ steps.sample.outputs.sql }}

      # repository_dispatch client_payload fallback
      - name: Run SQL Optima (API Payload Simulation)
        if: github.event_name == 'repository_dispatch'
        uses: ./
        with:
          engine: 'postgres'
          db_host: 'localhost'
          db_port: '5432'
          db_name: 'test_db'
          db_user: 'postgres'
          db_password: 'root'
          sql_content: ${{ github.event.client_payload.sql_code }}
