name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

  build:
    name: Build dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same-repo PRs: check out the head branch so we can push a dist refresh.
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Action bundle and assert dist/ is current
        run: |
          npm run build
          if git diff --quiet -- dist; then
            echo "dist/ is up to date"
            exit 0
          fi

          echo "::warning::dist/ drifted from the Ubuntu ncc build; refreshing committed artifacts."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "build: refresh dist from CI (ubuntu)"
          git push
          # Re-run is triggered by the push; fail this job so a stale local dist cannot go green silently.
          echo "::error::dist/ was out of date and has been refreshed on the branch. Re-run / wait for the next CI push."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: actionlint
        shell: bash
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) \
            1.7.7
          ./actionlint -color

  integration-postgres:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare database schema
        env:
          PGPASSWORD: root
        run: psql -h localhost -U postgres -d test_db -f examples/seed_postgres.sql

      - name: Load mixed Postgres sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_postgres.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (Postgres)
        uses: ./
        with:
          engine: postgres
          db_host: localhost
          db_port: '5432'
          db_name: test_db
          db_user: postgres
          db_password: root
          sql_content: ${{ steps.sample.outputs.sql }}

  integration-mysql:
    name: Integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare MySQL schema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot test_db < examples/seed_mysql.sql

      - name: Load mixed MySQL sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_mysql.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (MySQL)
        uses: ./
        with:
          engine: mysql
          db_host: 127.0.0.1
          db_port: '3306'
          db_name: test_db
          db_user: root
          db_password: root
          sql_content: ${{ steps.sample.outputs.sql }}

  integration-mariadb:
    name: Integration (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare MariaDB schema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot test_db < examples/seed_mysql.sql

      - name: Load mixed MySQL/MariaDB sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_mysql.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (MariaDB)
        uses: ./
        with:
          engine: mariadb
          db_host: 127.0.0.1
          db_port: '3306'
          db_name: test_db
          db_user: root
          db_password: root
          sql_content: ${{ steps.sample.outputs.sql }}

  integration-sqlite:
    name: Integration (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Load mixed SQLite sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_sqlite.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (SQLite)
        uses: ./
        with:
          engine: sqlite
          sql_content: ${{ steps.sample.outputs.sql }}

  integration-mssql:
    name: Integration (SQL Server)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Wait for SQL Server and create test_db
        run: |
          node <<'EOF'
          const sql = require('mssql');
          (async () => {
            const config = {
              server: '127.0.0.1',
              port: 1433,
              user: 'sa',
              password: 'Your_strong_Password123',
              database: 'master',
              options: { encrypt: false, trustServerCertificate: true },
              connectionTimeout: 5000,
            };
            for (let i = 0; i < 40; i += 1) {
              try {
                const pool = await sql.connect(config);
                await pool.request().query("IF DB_ID('test_db') IS NULL CREATE DATABASE test_db;");
                await pool.close();
                console.log('SQL Server ready');
                process.exit(0);
              } catch (error) {
                console.log(`Waiting for SQL Server (${i + 1}/40): ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
            }
            console.error('SQL Server did not become ready in time');
            process.exit(1);
          })();
          EOF

      - name: Load mixed SQL Server sample
        id: sample
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_mssql.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (SQL Server)
        uses: ./
        with:
          engine: mssql
          db_host: 127.0.0.1
          db_port: '1433'
          db_name: test_db
          db_user: sa
          db_password: Your_strong_Password123
          sql_content: ${{ steps.sample.outputs.sql }}

  integration-warehouses:
    name: Integration (BigQuery / Snowflake static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Load BigQuery sample
        id: bq
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_bigquery.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (BigQuery static-only)
        uses: ./
        with:
          engine: bigquery
          sql_content: ${{ steps.bq.outputs.sql }}

      - name: Load Snowflake sample
        id: sf
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_snowflake.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (Snowflake static-only)
        uses: ./
        with:
          engine: snowflake
          sql_content: ${{ steps.sf.outputs.sql }}
