version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # @actions/core 3.x is ESM-only and breaks CJS + ncc bundling of this Action.
    # Keep major bumps ignored until an ESM migration lands (see #121 / 6fc06b7).
    ignore:
      - dependency-name: "@actions/core"
        update-types: ["version-update:semver-major"]
    groups:
      npm-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
