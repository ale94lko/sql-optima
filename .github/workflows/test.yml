name: SQL Optima dispatch demo

# API / manual demos only. Unit tests, lint, build, and engine integrations live in ci.yml.
on:
  repository_dispatch:
    types: [analyze-sql]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-postgres:
    name: Analyze via repository_dispatch / workflow_dispatch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare database schema
        env:
          PGPASSWORD: root
        run: psql -h localhost -U postgres -d test_db -f examples/seed_postgres.sql

      - name: Load sample SQL
        id: sample
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          {
            echo 'sql<<EOF'
            cat examples/mixed_postgres.sql
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run SQL Optima (workflow_dispatch sample)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        with:
          engine: postgres
          db_host: localhost
          db_port: '5432'
          db_name: test_db
          db_user: postgres
          db_password: root
          sql_content: ${{ steps.sample.outputs.sql }}

      - name: Run SQL Optima (repository_dispatch payload)
        if: github.event_name == 'repository_dispatch'
        uses: ./
        with:
          engine: ${{ github.event.client_payload.engine || 'postgres' }}
          db_host: localhost
          db_port: '5432'
          db_name: test_db
          db_user: postgres
          db_password: root
          sql_content: ${{ github.event.client_payload.sql_code }}
