name: Release SQL Optima Action

on:
  push:
    tags:
      - 'v*.*.*'

# Default deny; the release job elevates only what it needs.
permissions: {}

jobs:
  release:
    name: Build, Commit Dist & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and build dist
        run: |
          npm ci
          npm run build

      - name: Commit and push compiled dist bundle
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          # JS bundle is tracked; WASM is gitignored on main but must ship on release tags.
          git add dist/
          git add -f dist/sql-wasm.wasm dist/sql-wasm.js
          if ! git diff-index --quiet HEAD; then
            git commit -m "build: update dist bundle for release ${{ github.ref_name }}"
            # Annotated/lightweight tags already exist on push; move the tag to
            # include release-only artifacts (e.g. force-added sql-wasm.js / .wasm).
            git tag -f "${{ github.ref_name }}"
            git push origin "refs/tags/${{ github.ref_name }}" --force
          else
            echo "No changes in dist/ to commit."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major floating tag (e.g. v1)
        run: |
          TAG="${{ github.ref_name }}"
          case "$TAG" in
            v*.*.*) ;;
            *)
              echo "Skipping major tag update for non-semver tag: $TAG"
              exit 0
              ;;
          esac
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push origin "refs/tags/$MAJOR" --force
          echo "Updated floating tag $MAJOR -> $TAG"
