name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coverage floors live in vitest.config.js (statements/lines/functions ≥90%,
      # branches ≥80%). Vitest exits non-zero if unmet → this job fails the workflow.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total; for (const k of ['statements','branches','functions','lines']) { const m=s[k]; console.log(k+': '+m.pct+'% ('+m.covered+'/'+m.total+')'); }"
          else
            echo "coverage/coverage-summary.json not found"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-unit
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Action bundle and assert dist/ is current
        run: |
          # Ignore executable-bit noise on copied binaries across hosts.
          git config core.fileMode false
          npm run build
          if [ ! -f dist/sql-wasm.wasm ] || [ ! -f dist/sql-wasm.js ]; then
            echo "::error::dist/sql-wasm.js / sql-wasm.wasm were not generated. Check scripts/copy-sqljs-wasm.js."
            exit 1
          fi
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is out of date. Run npm run build and commit the result."
            git diff --stat -- dist || true
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

      - name: actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_LINUX_AMD64_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_LINUX_AMD64_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" actionlint
          ./actionlint -color

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck JSDoc
        run: npm run typecheck

  # Default-path live engines (eval / merge-blocking). Per-engine jobs below stay as-is.
  # Credentials are job env only (in-container services; no GitHub secrets / external DBs).
  integration:
    name: Integration (Postgres + MySQL + MSSQL)
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      MYSQL_DATABASE: test_db
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: root
      # MSSQL image quirks: ACCEPT_EULA=Y is required or the container exits;
      # SA password must meet complexity rules; host port is 1433; no reliable
      # image HEALTHCHECK, so scripts/wait-for-mssql.js polls sa@master.
      MSSQL_SA_PASSWORD: Your_strong_Password123
      MSSQL_HOST: 127.0.0.1
      MSSQL_PORT: '1433'
      MSSQL_USER: sa
      MSSQL_DATABASE: test_db
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Postgres schema
        run: psql -h localhost -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f examples/seed_postgres.sql
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Prepare MySQL schema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < examples/seed_mysql.sql

      - name: Wait for SQL Server and create test_db
        run: node scripts/wait-for-mssql.js

      - name: Analyze mixed_postgres.sql against live Postgres
        env:
          INPUT_ENGINE: postgres
          INPUT_SQL_FILE: examples/mixed_postgres.sql
          INPUT_DB_HOST: localhost
          INPUT_DB_PORT: '5432'
          INPUT_DB_NAME: test_db
          INPUT_DB_USER: postgres
          INPUT_DB_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: node scripts/run-integration.js

      - name: Analyze mixed_mysql.sql against live MySQL
        env:
          INPUT_ENGINE: mysql
          INPUT_SQL_FILE: examples/mixed_mysql.sql
          INPUT_DB_HOST: 127.0.0.1
          INPUT_DB_PORT: '3306'
          INPUT_DB_NAME: test_db
          INPUT_DB_USER: root
          INPUT_DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
        run: node scripts/run-integration.js

      - name: Analyze mixed_mssql.sql against live SQL Server
        env:
          INPUT_ENGINE: mssql
          INPUT_SQL_FILE: examples/mixed_mssql.sql
          INPUT_DB_HOST: 127.0.0.1
          INPUT_DB_PORT: '1433'
          INPUT_DB_NAME: test_db
          INPUT_DB_USER: sa
          INPUT_DB_PASSWORD: ${{ env.MSSQL_SA_PASSWORD }}
        run: node scripts/run-integration.js

  integration-postgres:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare database schema
        env:
          PGPASSWORD: root
        run: psql -h localhost -U postgres -d test_db -f examples/seed_postgres.sql

      - name: Run SQL Optima (Postgres)
        uses: ./
        with:
          engine: postgres
          db_host: localhost
          db_port: '5432'
          db_name: test_db
          db_user: postgres
          db_password: root
          sql_file: examples/mixed_postgres.sql

  integration-mysql:
    name: Integration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare MySQL schema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot test_db < examples/seed_mysql.sql

      - name: Run SQL Optima (MySQL)
        uses: ./
        with:
          engine: mysql
          db_host: 127.0.0.1
          db_port: '3306'
          db_name: test_db
          db_user: root
          db_password: root
          sql_file: examples/mixed_mysql.sql

  integration-mariadb:
    name: Integration (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Prepare MariaDB schema
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -uroot -proot test_db < examples/seed_mysql.sql

      - name: Run SQL Optima (MariaDB)
        uses: ./
        with:
          engine: mariadb
          db_host: 127.0.0.1
          db_port: '3306'
          db_name: test_db
          db_user: root
          db_password: root
          sql_file: examples/mixed_mysql.sql

  integration-sqlite:
    name: Integration (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run SQL Optima (SQLite)
        uses: ./
        with:
          engine: sqlite
          sql_file: examples/mixed_sqlite.sql

  integration-mssql:
    name: Integration (SQL Server)
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Wait for SQL Server and create test_db
        run: |
          node <<'EOF'
          const sql = require('mssql');
          (async () => {
            const config = {
              server: '127.0.0.1',
              port: 1433,
              user: 'sa',
              password: 'Your_strong_Password123',
              database: 'master',
              options: { encrypt: false, trustServerCertificate: true },
              connectionTimeout: 5000,
            };
            for (let i = 0; i < 40; i += 1) {
              try {
                const pool = await sql.connect(config);
                await pool.request().query("IF DB_ID('test_db') IS NULL CREATE DATABASE test_db;");
                await pool.close();
                console.log('SQL Server ready');
                process.exit(0);
              } catch (error) {
                console.log(`Waiting for SQL Server (${i + 1}/40): ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
            }
            console.error('SQL Server did not become ready in time');
            process.exit(1);
          })();
          EOF

      - name: Run SQL Optima (SQL Server)
        uses: ./
        with:
          engine: mssql
          db_host: 127.0.0.1
          db_port: '1433'
          db_name: test_db
          db_user: sa
          db_password: Your_strong_Password123
          sql_file: examples/mixed_mssql.sql

  integration-warehouses:
    name: Integration (BigQuery / Snowflake static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run SQL Optima (BigQuery static-only)
        uses: ./
        with:
          engine: bigquery
          sql_file: examples/mixed_bigquery.sql

      - name: Run SQL Optima (Snowflake static-only)
        uses: ./
        with:
          engine: snowflake
          sql_file: examples/mixed_snowflake.sql
